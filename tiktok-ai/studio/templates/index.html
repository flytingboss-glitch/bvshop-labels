<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>短影音智能體</title>
<style>
  :root{--bg:#0f1117;--card:#181b24;--fg:#f2f4f8;--muted:#9aa3b2;--acc:#ff3b5c;--ok:#2ecc71}
  @media (prefers-color-scheme: light){:root{--bg:#f5f6fa;--card:#fff;--fg:#14161c;--muted:#5d6475}}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
  main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
  h1{font-size:22px;margin:8px 0 2px} .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #2a2f3d;background:transparent;color:var(--fg);font-size:16px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:17px;font-weight:700}
  button:disabled{opacity:.5}
  .bar{height:10px;background:#2a2f3d;border-radius:6px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
  video{width:100%;max-height:70vh;border-radius:12px;background:#000;margin-top:10px}
  .chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--muted)} .chk input{width:auto}
  pre{white-space:pre-wrap;font-size:14px;background:#0008;padding:10px;border-radius:8px}
  a.dl{display:inline-block;margin-top:10px;color:var(--acc);font-weight:700}
</style>
</head>
<body>
<main>
  <h1>🎬 短影音智能體</h1>
  <div class="sub">一句話 → 劇本 → 台灣腔配音 → 圖片 → 字幕 → 1080×1920 直式影片。LLM：{{ llm }}</div>

  <form class="card" id="f">
    <label>影片主題 / 文案想法</label>
    <textarea name="topic" rows="3" placeholder="例如：台北三家 CP 值最高的早餐店" required></textarea>
    <div class="row">
      <div><label>場景數（約 5 秒／場景）</label><input name="scenes" type="number" min="3" max="12" value="5"></div>
      <div><label>風格</label><input name="style" placeholder="輕鬆、資訊型、帶貨…"></div>
    </div>
    <div class="row">
      <div><label>配音</label><select name="voice">{% for v,l in voices %}<option value="{{v}}">{{l}}</option>{% endfor %}</select></div>
      <div><label>圖片來源</label><select name="images">{% for v,l in backends %}<option value="{{v}}" {% if v==default_backend %}selected{% endif %}>{{l}}</option>{% endfor %}</select></div>
    </div>
    <div class="chk"><input type="checkbox" name="offline" id="off"><label for="off" style="margin:0">離線測試（不呼叫 LLM，用模板劇本）</label></div>
    <button id="go">開始生成</button>
  </form>

  <div class="card" id="status" style="display:none">
    <div id="msg">排隊中</div>
    <div class="bar"><i id="pct"></i></div>
    <div id="result"></div>
  </div>
</main>
<script>
const f=document.getElementById('f'),st=document.getElementById('status'),msg=document.getElementById('msg'),pct=document.getElementById('pct'),res=document.getElementById('result'),go=document.getElementById('go');
f.addEventListener('submit',async e=>{
  e.preventDefault(); go.disabled=true; st.style.display='block'; res.innerHTML=''; pct.style.width='0';
  const fd=new FormData(f); const body=Object.fromEntries(fd.entries()); body.offline=fd.get('offline')?'1':'0';
  const r=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json(); if(!r.ok){msg.textContent=j.error;go.disabled=false;return}
  const poll=setInterval(async()=>{
    const s=await (await fetch('/api/jobs/'+j.id)).json();
    msg.textContent=s.message; pct.style.width=(s.percent||0)+'%';
    if(s.status==='done'){clearInterval(poll);go.disabled=false;
      res.innerHTML=`<video controls playsinline src="${s.video_url}"></video>
        <a class="dl" href="${s.video_url}" download>⬇ 下載影片（${s.duration}s）</a>
        <pre>${s.title}\n${(s.hashtags||[]).join(' ')}\n劇本來源：${s.script_source==='llm'?'AI 生成':'模板（LLM 未連線）'}</pre>`;}
    if(s.status==='error'){clearInterval(poll);go.disabled=false;}
  },1500);
});
</script>
</body>
</html>
