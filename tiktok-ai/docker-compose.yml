# 台灣短影音智能體：一鍵堆疊
#   docker compose up -d                      -> studio + ollama（CPU 也能跑）
#   docker compose --profile gpu up -d        -> 再加 ComfyUI（本機無限生圖，需 NVIDIA GPU + nvidia-container-toolkit）
#   docker compose --profile extra up -d      -> 再加 MoneyPrinterTurbo（文案成片）與 AutoClip（長片切短片）
#   docker compose --profile voice up -d      -> 再加 CosyVoice（聲音克隆）與 MuseTalk（對嘴），需 NVIDIA GPU
#
# RTX 4050 6GB 建議：gpu / voice 兩個 profile 不要同時跑生圖與對嘴；Ollama 用 gemma3:4b。
#
# 手機使用：同一個 Wi-Fi 打開 http://<電腦IP>:7860；出門用 Tailscale / Cloudflare Tunnel。
services:
  studio:                              # 本專案：一句話 -> 直式短影片（手機友善網頁）
    build: ./studio
    container_name: tiktok-studio
    ports: ["${STUDIO_PORT:-7860}:7860"]
    env_file: [.env]
    volumes:
      - ./output:/data/output
      - ./work:/data/work
      - ./uploads:/data/uploads
      - ./bgm:/data/bgm:ro
    depends_on: [ollama, douyin-api]
    restart: unless-stopped

  douyin-api:                          # ① 抖音解析器（Apache-2.0，有實作抖音簽名）。cookie 來自網頁「⚙️ 抖音 Cookie」，變更會自動重啟
    image: evil0ctal/douyin_tiktok_download_api:V4.1.2
    container_name: douyin-api
    expose: ["80"]                     # 只給 studio 內部用，不對外開埠
    volumes:
      - ./uploads:/shared:ro
      - ./services/douyin-api/entrypoint.sh:/entrypoint.sh:ro
    command: ["sh", "/entrypoint.sh"]
    restart: unless-stopped

  ollama:                              # 免費本機 LLM（劇本）；首次：docker exec ollama ollama pull gemma3:4b（6GB 顯卡）或 qwen2.5:7b
    image: ollama/ollama:latest
    container_name: ollama
    ports: ["${OLLAMA_PORT:-11434}:11434"]
    volumes: [ollama:/root/.ollama]
    restart: unless-stopped
    # 有 NVIDIA 顯卡再把下面三行打開，速度快很多
    # deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: all, capabilities: [gpu] } ] } } }

  comfyui:                             # 本機無限生圖（SDXL / Flux / Z-Image…），模型放 ./models
    profiles: [gpu]
    image: yanwk/comfyui-boot:cu124-slim
    container_name: comfyui
    ports: ["${COMFYUI_PORT:-8188}:8188"]
    volumes:
      - ./comfyui:/root
    deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: all, capabilities: [gpu] } ] } } }
    restart: unless-stopped

  cosyvoice:                           # ② 聲音克隆（Apache-2.0）。首次啟動會從 ModelScope 下載模型（約 2GB）
    profiles: [voice]
    build: { context: https://github.com/FunAudioLLM/CosyVoice.git, dockerfile: runtime/python/Dockerfile }
    container_name: cosyvoice
    expose: ["50000"]
    command: ["/bin/bash", "-c", "cd /opt/CosyVoice/CosyVoice/runtime/python/fastapi && python3 server.py --port 50000 --model_dir ${COSYVOICE_MODEL:-iic/CosyVoice2-0.5B}"]
    volumes: [./cosyvoice-models:/root/.cache/modelscope]
    deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: all, capabilities: [gpu] } ] } } }
    restart: unless-stopped

  musetalk:                            # ② 對嘴（MIT）。4GB 顯存可跑（fp16），8 秒影片約 5 分鐘
    profiles: [voice]
    build: ./services/musetalk-api
    container_name: musetalk
    expose: ["8600"]
    environment:
      - MUSETALK_EXTRA_ARGS=--use_float16 --batch_size 4
    deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: all, capabilities: [gpu] } ] } } }
    restart: unless-stopped

  moneyprinterturbo:                   # 133k★ 文案成片（Pexels 影片素材 + 字幕 + 配音），WebUI 8501 / API 8080
    profiles: [extra]
    build: { context: https://github.com/harry0703/MoneyPrinterTurbo.git }
    container_name: moneyprinterturbo
    command: ["streamlit", "run", "./webui/Main.py", "--browser.serverAddress=0.0.0.0", "--server.enableCORS=True", "--browser.gatherUsageStats=False"]
    ports: ["${MPT_PORT:-8501}:8501"]
    volumes: [./mpt:/MoneyPrinterTurbo/storage]
    env_file: [.env]
    restart: unless-stopped

  autoclip:                            # 9.6k★ 長影片 -> 爆點短片 + 字幕 + 封面 + 發文文案（需 redis）
    profiles: [extra]
    build: { context: https://github.com/zhouxiaoka/autoclip.git }
    container_name: autoclip
    ports: ["${AUTOCLIP_PORT:-3000}:3000", "${AUTOCLIP_API_PORT:-8000}:8000"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LLM_PROVIDER=openai
      - OPENAI_BASE_URL=${LLM_BASE_URL:-http://ollama:11434/v1}
      - OPENAI_API_KEY=${LLM_API_KEY:-ollama}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:7b}
    volumes: [./autoclip-data:/app/data, ./autoclip-uploads:/app/uploads]
    depends_on: [redis, ollama]
    restart: unless-stopped

  redis:
    profiles: [extra]
    image: redis:7-alpine
    container_name: autoclip-redis
    restart: unless-stopped

volumes:
  ollama:
